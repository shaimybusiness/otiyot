<style>
/* ============ Otiyot · ADN « galerie sombre » ============ */
:root{
--void:#030c07;--surf:#000;--line:#1e3727;--tx:#fff;--mut:#9b9b9b;--gold:#bfc5c7;--gold2:#eef1f1;--gold3:#7d8688;--navy:#0e2a19;
--al:url(img/01.webp);--ar:url(img/02.webp);
--ease:cubic-bezier(.2,.7,.2,1);
--px:clamp(20px,5.5vw,100px);--sy:clamp(96px,12vw,200px);
--f:Inter,Heebo,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
--fb:Inter,Heebo,ui-sans-serif,system-ui,sans-serif;
--d-xl:clamp(3rem,8.4vw,111px);--d:clamp(2.5rem,6vw,80px);--h-lg:clamp(2rem,4vw,50px);--h:clamp(1.6rem,2.6vw,35px);--h-sm:clamp(1.25rem,1.9vw,26px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px;-webkit-text-size-adjust:100%;background:var(--void)}
body{margin:0;background:var(--void);color:var(--tx);font:400 18px/1.67 var(--f);-webkit-font-smoothing:antialiased;overflow-x:clip;-webkit-tap-highlight-color:transparent}
[dir=rtl] body,[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] .disp{font-family:Heebo,Inter,sans-serif}
h1,h2,h3{font-weight:400;margin:0;letter-spacing:-.035em}
p{margin:0}a{color:inherit}
.he{font-family:'Frank Ruhl Libre',Heebo,serif}
::selection{background:#fff;color:#030c07}
:focus-visible{outline:1px solid #fff;outline-offset:4px}
.mut{color:var(--mut)}
.eb{display:block;font:400 14px/1.67 var(--f);color:var(--mut);letter-spacing:0}
.body{font:400 18px/1.67 var(--fb);color:var(--tx)}[dir=rtl] .body{font-family:Heebo,sans-serif}

/* boutons : pilule contour blanc, jamais de remplissage au repos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:10px 22px;border:1px solid #fff;border-radius:45px;background:transparent;color:#fff;font:500 14px/1.2 var(--f);text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .35s var(--ease),color .35s var(--ease),border-color .35s,opacity .3s}
.btn:hover{background:#fff;color:#030c07}.btn:active{opacity:.7}
.btn:disabled{opacity:.4;cursor:default}
.btn.q{border-color:var(--line)}.btn.q:hover{border-color:#fff}
.btn svg{width:16px;height:16px;flex:none}

/* ---------- en-tête ---------- */
header{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;gap:clamp(16px,3vw,48px);padding:calc(18px + env(safe-area-inset-top,0px)) var(--px) 18px;background:transparent;border-bottom:1px solid transparent;transition:transform .6s var(--ease),background .4s,border-color .4s}
header.sc{background:#030c07f2;border-bottom-color:var(--line)}
header.hide{transform:translateY(-101%)}
.logo{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0;color:#fff;cursor:pointer;direction:ltr;font:400 26px/1 var(--f);letter-spacing:-.03em}
.logo span{font:400 15px/1 Heebo,sans-serif;color:var(--mut);letter-spacing:0}
nav.top{display:flex;gap:clamp(18px,2.4vw,36px);margin-inline-start:auto}
nav.top a{font-size:16px;text-decoration:none;color:var(--mut);cursor:pointer;transition:color .3s}
nav.top a:hover,nav.top a.act{color:#fff}
header>.btn{min-height:40px;padding:8px 18px}
.lg{position:relative;display:flex;direction:ltr}
.lg button{border:0;background:none;color:var(--mut);font:500 12px/1 var(--f);letter-spacing:.08em;padding:12px 8px;cursor:pointer;transition:color .3s}
.lg button[data-l=he]{font-family:Heebo,sans-serif;font-size:13px;letter-spacing:0}
.lg button:hover,.lg button.on{color:#fff}
.lg .ind{position:absolute;left:0;bottom:6px;height:1px;width:0;background:#fff;transition:transform .5s var(--ease),width .5s var(--ease)}
.bgr{display:none;width:44px;height:44px;border:0;background:none;position:relative;cursor:pointer;flex:none;margin-inline-end:-10px}
.bgr i{position:absolute;left:11px;right:11px;height:1px;background:#fff;transition:transform .5s var(--ease),top .5s var(--ease)}
.bgr i:nth-child(1){top:18px}.bgr i:nth-child(2){top:26px}
.mo .bgr i:nth-child(1){top:22px;transform:rotate(45deg)}.mo .bgr i:nth-child(2){top:22px;transform:rotate(-45deg)}
#mnav{position:fixed;inset:0;z-index:15;background:var(--void);display:flex;flex-direction:column;justify-content:flex-end;padding:120px var(--px) calc(48px + env(safe-area-inset-bottom,0px));opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s}
#mnav a{font:400 clamp(2.4rem,11vw,3.4rem)/1.12 var(--f);letter-spacing:-.04em;color:#fff;text-decoration:none;padding:4px 0;border-bottom:1px solid var(--line);transform:translateY(16px);opacity:0;transition:opacity .5s,transform .6s var(--ease)}
[dir=rtl] #mnav a{font-family:Heebo,sans-serif}
#mnav .btn{margin-top:32px;align-self:flex-start}
.mo,.mo body{overflow:hidden}
.mo #mnav{opacity:1;visibility:visible;transition:opacity .45s}
.mo #mnav a{opacity:1;transform:none;transition-delay:calc(.08s + var(--k)*.05s)}
@media(max-width:1060px){nav.top{display:none}.lg{margin-inline-start:auto}.bgr{display:block}}
@media(max-width:640px){header>.btn{display:none}.logo{font-size:23px}}

/* ---------- sections ---------- */
section,.band{padding:var(--sy) var(--px);border-top:1px solid var(--line)}
.hd{display:grid;gap:22px;margin-bottom:clamp(48px,6vw,90px);max-width:1200px}
.hd h2{font-size:var(--d);line-height:1.04}
.hd p{max-width:620px}

/* héros */
.hero{padding:calc(clamp(150px,18vw,230px) + env(safe-area-inset-top,0px)) var(--px) clamp(60px,7vw,100px);border:0}
.hero h1{font-size:var(--d-xl);line-height:1;max-width:12.5em;margin:18px 0 clamp(28px,3vw,44px)}
.hero .body{max-width:560px;color:#d9d9d9}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.feat{margin:0;position:relative;background:var(--surf)}
.feat img{display:block;width:100%;aspect-ratio:2/1;object-fit:cover;object-position:70% 50%}
.feat figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;padding:20px var(--px) 0;font-size:var(--h-sm);letter-spacing:-.02em}
.feat figcaption span{font-size:14px;color:var(--mut);letter-spacing:0}
@media(max-width:700px){.feat img{aspect-ratio:4/5;object-position:72% 50%}}

/* rouleau */
#rouleau{padding-inline:0;text-align:start}
#rouleau{padding-top:clamp(72px,7vw,110px)}#rouleau .hd{padding-inline:var(--px);margin-bottom:clamp(10px,2vw,30px)}#rouleau .hd h2{font-size:var(--h-lg);line-height:1.1}@media(min-width:801px){#rouleau .hd h2 br{display:none}}.mo #cart{visibility:hidden}
.scn2{position:relative;width:100%;max-width:1680px;margin:0 auto;height:clamp(440px,calc(calc(var(--vh,1vh)*100) - 290px),700px);container-type:size;transition:opacity 1.2s,transform 1.4s var(--ease)}
.scn2.pre{opacity:0;transform:translateY(30px) scale(.95)}
.scn2.nofx,.scn2.nofx *{transition:none!important}
.as{position:absolute;top:0;height:100%;background-size:100% 100%;transition:transform 3s cubic-bezier(.65,0,.2,1);z-index:2;pointer-events:none}
.as.l{left:0;aspect-ratio:355/1450;background-image:var(--al);transform:translateX(calc(50cqw - 100cqh*.1586))}
.as.r{right:0;aspect-ratio:340/1450;background-image:var(--ar);transform:translateX(calc(100cqh*.19 - 50cqw))}
.open .as{transform:none}
.sheet{position:absolute;top:30%;height:43.8%;left:calc(100cqh*.1586 - 10px);right:calc(100cqh*.19 - 10px);clip-path:inset(0 50% 0 50%);transition:clip-path 3s cubic-bezier(.65,0,.2,1);background:linear-gradient(90deg,#cfcabb,#efebe0 5%,#f8f6ee 50%,#efebe0 95%,#cfcabb);z-index:1}
.open .sheet{clip-path:inset(-90px 0 -90px 0)}
.in{position:absolute;inset:0;direction:rtl;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;outline:0}
.in.grab{cursor:grabbing}.in:focus-visible{outline:1px solid #030c07;outline-offset:-4px}
#vp{position:absolute;inset:0 3.4%;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 1.6%,#000 98.4%,transparent);mask-image:linear-gradient(90deg,transparent,#000 1.6%,#000 98.4%,transparent)}
#strip{position:absolute;right:0;top:4.5%;bottom:4.5%;width:0;will-change:transform}
.colm{position:absolute;top:0;bottom:0;width:calc(var(--pw)*40);display:grid;grid-template-columns:repeat(40,1fr);grid-template-rows:repeat(8,1fr);direction:rtl}
.L{display:grid;place-items:center;font:700 var(--fs,20px)/1 'David Libre','Frank Ruhl Libre',serif;border:0;background:none;cursor:pointer;color:#a29d92;opacity:0;padding:0;position:relative;z-index:1;will-change:transform;transition:opacity .8s,transform .22s cubic-bezier(.2,.8,.2,1),color .2s,filter .22s}
.open .L{opacity:1;transition:opacity .8s calc(1.9s + var(--d)*1ms),transform .22s cubic-bezier(.2,.8,.2,1),color .2s,filter .22s}
.in.fast .L,.colm.cn .L{opacity:1;transition:transform .22s cubic-bezier(.2,.8,.2,1),color .2s,filter .22s}
.L.a:hover,.L.lens.a{color:#16130e}.L.t{color:#0c0a08;cursor:default}.L.s{color:#16130e;box-shadow:inset 0 -2px #16130e}
.L.lens{filter:drop-shadow(0 4px 4px #00000040)}
.L:focus-visible{outline:1px solid #030c07;outline-offset:1px}
.L.pop:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid #16130e;animation:rp .6s ease-out forwards}@keyframes rp{from{transform:scale(.6);opacity:.9}to{transform:scale(2.8);opacity:0}}
@media(max-width:800px){.scn2{height:420px}}

/* navigation du rouleau */
.nv{width:min(1100px,100% - 2*var(--px));margin:34px auto 0;display:grid;gap:18px}
.nv1{display:flex;align-items:center;gap:16px;direction:rtl}
.nb{flex:none;width:44px;height:44px;border-radius:45px;border:1px solid var(--line);background:none;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;transition:border-color .3s,background .3s,color .3s,opacity .3s}
.nb:hover{border-color:#fff}.nb:active{background:#fff;color:#030c07}.nb:disabled{opacity:.25;pointer-events:none}.nb svg{width:18px;height:18px}
.tr{position:relative;flex:1;height:44px;cursor:pointer;touch-action:none;outline:0}
.tr:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.tr:focus-visible{outline:1px solid #fff;outline-offset:2px}
.tk i{position:absolute;top:50%;width:1px;height:6px;margin-top:-3px;background:#ffffff30}.tk i.bk{height:16px;margin-top:-8px;background:#fff}
.nfl{position:absolute;right:0;top:50%;height:1px;background:#fff;pointer-events:none}
.th{position:absolute;top:50%;width:30px;height:30px;margin-top:-15px;transform:translateX(50%);border-radius:50%;background:#fff;color:#030c07;display:grid;place-items:center;font:500 14px/1 var(--f);user-select:none;cursor:grab;transition:transform .3s var(--ease)}
.th.he{font:400 17px/1 'Frank Ruhl Libre',serif}
.tr:hover .th{transform:translateX(50%) scale(1.12)}.tr:active .th{cursor:grabbing}
.nv2{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.sel{position:relative;max-width:100%}
.sel select{appearance:none;-webkit-appearance:none;background:transparent;border:1px solid var(--line);color:#fff;border-radius:45px;min-height:44px;padding:10px 44px 10px 20px;font:500 14px var(--f);cursor:pointer;max-width:100%;transition:border-color .3s}
.sel select:hover,.sel select:focus-visible{border-color:#fff;outline:0}
.sel:after{content:"";position:absolute;right:20px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:1px solid #fff;border-bottom:1px solid #fff;transform:rotate(45deg);pointer-events:none}
[dir=rtl] .sel select{padding:10px 20px 10px 44px}[dir=rtl] .sel:after{right:auto;left:20px}
.sel option,.sel optgroup{background:#030c07;color:#fff}
.ni{font-size:14px;color:var(--mut)}.ni b{color:#fff;font-weight:400}
.nj{display:flex;gap:8px;align-items:center}
.nj input{width:130px;min-height:44px;padding:10px 18px;border:1px solid var(--line);border-radius:45px;background:transparent;color:#fff;font:400 16px var(--f);-moz-appearance:textfield;appearance:textfield}
.nj input:focus{outline:0;border-color:#fff}
.nj input::-webkit-outer-spin-button,.nj input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.nh,.cp{text-align:center;font-size:14px;color:var(--mut);margin:0 auto;max-width:640px;padding:0 var(--px)}
.cp{margin-top:12px}
@media(max-width:700px){.nv2{justify-content:center}.ni{width:100%;text-align:center;order:3}}

/* tarifs */
.pan{display:grid;grid-template-columns:repeat(3,1fr);gap:0 clamp(24px,3vw,50px);margin:clamp(70px,8vw,120px) var(--px) 0}
.pan>div{display:flex;flex-direction:column;align-items:flex-start;gap:14px;border-top:1px solid var(--line);padding-top:28px}
.pan .n{font:400 var(--d)/1 var(--f);letter-spacing:-.04em;direction:ltr;unicode-bidi:isolate}
.pan .btn{margin-top:auto}
.amt{display:flex;align-items:baseline;gap:10px;width:100%;border-bottom:1px solid var(--line);direction:ltr;transition:border-color .3s}
.amt:focus-within{border-color:#fff}
.amt span{font:400 var(--h)/1 var(--f);color:var(--mut)}
.amt input{flex:1;min-width:0;border:0;outline:0;background:none;padding:0 0 6px;color:#fff;font:400 var(--d)/1 var(--f);letter-spacing:-.04em;-moz-appearance:textfield;appearance:textfield}
.amt input::placeholder{color:#ffffff40;font-size:18px;letter-spacing:0}
.amt input::-webkit-outer-spin-button,.amt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.amt.bad{border-color:#fff;animation:sk .4s}@keyframes sk{25%{translate:-6px}75%{translate:6px}}
@media(max-width:860px){.pan{grid-template-columns:1fr}.pan>div{padding:26px 0 34px}}

/* progression */
.prog{--p:0;margin:clamp(70px,8vw,120px) var(--px) 0;border-top:1px solid var(--line);padding-top:28px}
.pg-top{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap}
.pg-main,.pg-side{display:flex;flex-direction:column;gap:8px}
.pg-side{align-items:flex-end;text-align:end}
.pg-n{font:400 var(--d-xl)/1 var(--f);letter-spacing:-.05em;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.pg-n small{font-size:.34em;color:var(--mut);margin-inline-start:.15em;letter-spacing:0}
.pg-s{font-size:16px;color:var(--mut)}.pg-s b{color:#fff;font-weight:400}
.pg-side .n{font:400 var(--d)/1 var(--f);letter-spacing:-.04em}
.pg-side a{font-size:14px;color:var(--mut);text-decoration:none;border-bottom:1px solid var(--line)}.pg-side a:hover{color:#fff;border-color:#fff}
.pg-bar{position:relative;height:1px;margin-top:40px;background:var(--line)}
.pg-bar i{position:absolute;inset-inline-start:0;top:0;height:1px;width:max(calc(var(--p)*1%),12px);background:#fff;transition:width 1.4s var(--ease)}
@media(max-width:600px){.pg-side{align-items:flex-start;text-align:start}}

/* projet */
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(40px,4vw,60px)}
.col{border-top:1px solid var(--line);padding-top:26px}
.col .no{display:block;font-size:14px;color:var(--mut);margin-bottom:clamp(36px,5vw,70px)}
.col h3{font-size:var(--h);line-height:1.3;margin-bottom:16px;letter-spacing:-.03em}
.col p{font:400 17px/1.67 var(--fb);color:#cfcfcf}[dir=rtl] .col p{font-family:Heebo,sans-serif}
@media(max-width:900px){.cols{grid-template-columns:1fr}.col .no{margin-bottom:24px}}

/* citation monumentale */
.quote q{display:block;font:400 var(--d)/1.06 var(--f);letter-spacing:-.04em;max-width:15em;quotes:none}
[dir=rtl] .quote q{font-family:Heebo,sans-serif}
.quote .eb{margin-bottom:30px}
.quote p{margin-top:36px;color:var(--mut);font-size:18px}

/* Chayalim */
.chg{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(40px,4vw,56px) clamp(14px,1.6vw,24px)}
.ch{background:none;border:0;padding:0;color:inherit;text-align:start;font:inherit;cursor:pointer;min-width:0}
.ph{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--surf)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05);transition:filter .8s var(--ease),transform 1.2s var(--ease)}
.ch:hover .ph img,.ch:focus-visible .ph img{filter:none;transform:scale(1.04)}
.ch b{display:block;margin-top:18px;font:400 16px/1.4 Heebo,Inter,sans-serif;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ch span{display:block;margin-top:6px;font-size:14px;line-height:1.4;color:var(--mut)}
.hn{direction:rtl;unicode-bidi:isolate}
@media(max-width:1100px){.chg{grid-template-columns:repeat(4,1fr)}}
@media(max-width:640px){.chg{grid-template-columns:repeat(3,1fr);gap:28px 10px}.ch b{font-size:13px;margin-top:10px}.ch span{font-size:11.5px}}

/* familles */
.hall{display:flex;flex-wrap:wrap;gap:10px;margin-top:40px}
.hall span{border:1px solid var(--line);border-radius:45px;padding:7px 16px;font-size:14px;color:#d9d9d9}

/* contact */
#contact h2{font-size:var(--d-xl);line-height:1}
#contact .body{max-width:560px;color:#d9d9d9}

/* pied de page */
footer{border-top:1px solid var(--line);padding:clamp(70px,8vw,120px) var(--px) calc(40px + env(safe-area-inset-bottom,0px))}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:50px}
.fgrid b{display:block;font-weight:400;font-size:20px;margin-bottom:20px}
.fgrid a,.fgrid span{display:block;color:var(--mut);text-decoration:none;font-size:18px;line-height:1.8;transition:color .3s}
.fgrid a:hover{color:#fff}
.fbot{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:clamp(70px,8vw,120px);padding-top:24px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
.fbot button{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:10px 0}.fbot button:hover{color:#fff}
.fword{display:block;font:400 clamp(4.4rem,19vw,280px)/.85 var(--f);letter-spacing:-.06em;margin-top:clamp(60px,8vw,110px);color:#fff;white-space:nowrap}
@media(max-width:760px){.fgrid{grid-template-columns:1fr;gap:40px}}

/* panier */
#cart{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 60px));visibility:hidden;z-index:30;display:flex;align-items:center;gap:10px;background:#030c07;border:1px solid var(--line);border-radius:45px;padding:6px 6px 6px 22px;transition:transform .5s var(--ease);font-size:14px;white-space:nowrap;max-width:calc(100vw - 24px)}
#cart.on{transform:translate(-50%,0);visibility:visible}#cart .btn{min-height:40px;padding:8px 16px}
